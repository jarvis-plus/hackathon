<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffaa"/>
      <stop offset="100%" style="stop-color:#00aaff"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="url(#accent)" stroke-width="1"/>
  <!-- Robot face -->
  <rect x="9" y="10" width="14" height="12" rx="2" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="12.5" cy="14" r="1.5" fill="#00ffaa"/>
  <circle cx="19.5" cy="14" r="1.5" fill="#00aaff"/>
  <!-- Mouth/data -->
  <rect x="11" y="18" width="2" height="2" fill="#00ffaa"/>
  <rect x="15" y="18" width="2" height="2" fill="#00aaff"/>
  <rect x="19" y="18" width="2" height="2" fill="#aa00ff"/>
  <!-- Antenna -->
  <line x1="16" y1="10" x2="16" y2="6" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="5" r="1.5" fill="#00ffaa"/>
  <!-- Checkmark badge -->
  <circle cx="24" cy="24" r="6" fill="#00ffaa"/>
  <path d="M21 24 L23 26 L27 22" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

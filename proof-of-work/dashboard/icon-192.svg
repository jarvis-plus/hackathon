<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffaa"/>
      <stop offset="100%" style="stop-color:#00aaff"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="96" cy="96" r="80" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.3"/>
  <!-- Chain links (stylized) -->
  <g fill="url(#accent)">
    <!-- Left chain link -->
    <rect x="48" y="72" width="40" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <!-- Right chain link -->
    <rect x="104" y="72" width="40" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <!-- Connecting bar -->
    <rect x="78" y="90" width="36" height="12" rx="4"/>
  </g>
  <!-- Checkmark -->
  <path d="M70 100 L88 118 L122 74" fill="none" stroke="#00ffaa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pulse rings -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="#00ffaa" stroke-width="1" opacity="0.2"/>
  <circle cx="96" cy="96" r="60" fill="none" stroke="#00ffaa" stroke-width="1" opacity="0.1"/>
</svg>

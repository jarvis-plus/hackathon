<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffaa"/>
      <stop offset="100%" style="stop-color:#00aaff"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.3"/>
  <!-- Chain links (stylized) -->
  <g fill="url(#accent)">
    <!-- Left chain link -->
    <rect x="120" y="192" width="110" height="128" rx="20" fill="none" stroke="url(#accent)" stroke-width="10"/>
    <!-- Right chain link -->
    <rect x="282" y="192" width="110" height="128" rx="20" fill="none" stroke="url(#accent)" stroke-width="10"/>
    <!-- Connecting bar -->
    <rect x="200" y="235" width="112" height="42" rx="12"/>
  </g>
  <!-- Checkmark -->
  <path d="M180 260 L232 312 L332 192" fill="none" stroke="#00ffaa" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pulse rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00ffaa" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00ffaa" stroke-width="2" opacity="0.1"/>
</svg>
